# Runs tests/run_tests.py on every push and pull request: every script, in
# both Python and PowerShell, against the fake Confluence in tests/. GitHub's
# Ubuntu machines come with Python 3, PowerShell 7 and git already
# installed, so there's nothing to set up.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check the .ps1 files' encoding
        shell: pwsh
        run: ./check_script_encoding.ps1

      - name: Run every script against the fake Confluence
        run: python3 tests/run_tests.py

  # The same PowerShell checks again on Windows PowerShell 5.1 - the
  # version that comes with Windows and that most people run these with,
  # which the Ubuntu job above (PowerShell 7) can't cover.
  windows-powershell:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run the .ps1 scripts on Windows PowerShell 5.1
        run: python tests/run_tests.py --windows-powershell
